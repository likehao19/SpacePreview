[package]
name = "space-preview"
version = "0.10.18"
description = "A quiet, local-first file previewer"
authors = ["SpacePreview"]
edition = "2021"

[lib]
name = "space_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Updates use NSIS directly and macOS .app.tar.gz; legacy Windows ZIP bundles are unnecessary.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4"
auto-launch = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
png = "0.18"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
