name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.3'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        run: node scripts/check-release-version.mjs
      - name: Test official release synchronization
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -q
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure TAURI_SIGNING_PRIVATE_KEY before publishing updates (docs/UPDATING.md)."
            exit 1
          fi
      - name: Prepare preview engine resources
        run: npm run prebuild
      - run: npm test -- --maxWorkers=2
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --config src-tauri/tauri.updater.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify and collect installer
        run: node scripts/package-release.mjs ${{ matrix.target }} ${{ matrix.platform }}
      - name: Check Linux desktop startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          xvfb-run -a dbus-run-session -- timeout 10s src-tauri/target/${{ matrix.target }}/release/space-preview > linux-startup.log 2>&1
          STATUS=$?
          cat linux-startup.log
          test "$STATUS" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish all platform installers
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Generate complete update manifest
        run: node scripts/updater-manifest.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          test "$GITHUB_REF_NAME" = "$TAG"
          test -f "release-assets/SpacePreview-$VERSION-windows-x64-setup.exe"
          test -f "release-assets/SpacePreview-$VERSION-macos-x64.dmg"
          test -f "release-assets/SpacePreview-$VERSION-macos-arm64.dmg"
          test -f "release-assets/SpacePreview-$VERSION-linux-x64.deb"
          test -f "release-assets/SpacePreview-$VERSION-linux-x64.AppImage"
          test -f "release-assets/latest.json"
          (cd release-assets && sha256sum *.exe *.dmg *.deb *.AppImage *.tar.gz *.sig latest.json > SHA256SUMS.txt)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "SpacePreview $TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file RELEASE-NOTES.md
      - name: Upload complete release to official server
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          SPACEPREVIEW_DEPLOY_HOST: ${{ secrets.SPACEPREVIEW_DEPLOY_HOST }}
          SPACEPREVIEW_DEPLOY_KEY: ${{ secrets.SPACEPREVIEW_DEPLOY_KEY }}
          SPACEPREVIEW_DEPLOY_KNOWN_HOSTS: ${{ secrets.SPACEPREVIEW_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/upload-release.sh
