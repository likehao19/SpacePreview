# Included by the existing spacepreview.likh.cn BaoTa virtual host.
# Metadata and stable fallback URLs must never be cached across atomic switches.
location ^~ /downloads/ {
    alias /srv/spacepreview-downloads/current/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Stop inherited open-file caching from retaining a previous symlink target.
    open_file_cache off;
}

location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; }
location = /index.html { add_header Cache-Control "no-cache" always; }
location = /script.js { add_header Cache-Control "no-cache" always; }
location = /i18n.js { add_header Cache-Control "no-cache" always; }
